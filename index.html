<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lima Live Museum of Movie Locations</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

    <header>
        <div class="nav-logo">
            <a href="index.html">Lima Live Museum of Movie Locations</a>
            <span class="site-sub">Explore iconic movie locations around the world</span>
        </div>
        <nav class="nav-links">
            <a href="index.html" class="nav-link">Map</a>
            <a href="disclaimer_page.html" class="nav-link">About</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Welcome to the Lima Live Museum</h1>
        <p>Discover iconic movie locations around the world through maps, stories, and photos!</p>
        <button class="hero-cta" id="heroBtn">Explore Locations</button>
    </section>

    <div class="filter-bar">
       <button class="pill active" onclick="filterByGenre('All')">All genres</button>
        <button class="pill" style="--color: #9b1c1c" onclick="filterByGenre('Action')">Action</button>
        <button class="pill" style="--color: #166534" onclick="filterByGenre('Adventure')">Adventure</button>
        <button class="pill" style="--color: #854d0e" onclick="filterByGenre('Comedy')">Comedy</button>
        <button class="pill" style="--color: #633806" onclick="filterByGenre('Drama')">Drama</button>
        <button class="pill" style="--color: #3C3489" onclick="filterByGenre('Fantasy')">Fantasy</button>
        <button class="pill" style="--color: #6b21a8" onclick="filterByGenre('Horror')">Horror</button>
        <button class="pill" style="--color: #075985" onclick="filterByGenre('Sci-fi')">Sci-fi</button>
        <button class="pill" style="--color: #9d174d" onclick="filterByGenre('Romance')">Romance</button>
    </div>

    <div class="main">

        <div class="map" id="map"></div>

        <div class="card-list" id="list"></div>
        
    </div>

    <script src="map.js"></script>
    <script>
        const filming = [
            {
                movie: "Gladiator",
                year: 2000,
                name: "Plaza de roba",
                country: "Peru",
                genre: "Drama",
                description: "The Colosseum inspired all the visual aesthetics. Some scenes were shot here.",
                access: "Public - book tickets online in advance",
                lat: -12.0464,
                lng: -77.0428
            },
            {
                movie: "Game of Thrones",
                year: 2011,
                name: "Via a caso",
                country: "Peru",
                genre: "Fantasy",
                description: "King's Landing was shot almost entirely in the Old Town. Its walls and the harbor appear in plenty of scenes.",
                lat: -12.1200,
                lng: -77.0300
            },
            {
                movie: "Movie Title",
                year: 1997,
                name: "Name of Location",
                country: "Name of Country",
                genre: "Comedy",
                description: "blablabla",
                access: "blablabla"
            }
        ]

        const list = document.getElementById("list")
        const markers = []

        function getMarkerColor(genre) {
            const colors = {
                'Action':    '#9b1c1c',
                'Comedy':    '#854d0e',
                'Drama':     '#633806',
                'Sci-fi':    '#075985',
                'Horror':    '#6b21a8',
                'Romance':   '#9d174d',
                'Adventure': '#166534',
                'Fantasy':   '#3C3489'
            }
            return colors[genre] || '#444'
        }

        function createPin(genre) {
            const color = getMarkerColor(genre)
            return L.divIcon({
                className: '',
                html: `<div style="
                    width: 14px;
                    height: 14px;
                    border-radius: 50%;
                    background: ${color};
                    border: 2px solid white;
                    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
                "></div>`,
                iconSize: [14, 14],
                iconAnchor: [7, 7],
                popupAnchor: [0, -10]
            })
        }

        function showCard(data) {
            list.innerHTML = ""
            data.forEach(function(loc) {
                list.innerHTML += `
                    <div class="card" onclick="toggleDetail(this, '${loc.name}', ${loc.lat || 'null'}, ${loc.lng || 'null'})">
                        <p class="label">${loc.movie} · ${loc.year}</p>
                        <h2>${loc.name}</h2>
                        <div class="meta">
                            <span>${loc.country}</span>
                            <span class="badge ${loc.genre.toLowerCase()}">${loc.genre}</span>
                    <p class="access">${loc.access}</p> 

                        </div>
                        <div class="detail">
                            <hr>
                            <p class="description">${loc.description}</p>
                            <button class="btn-more" onclick="expandCard(event, this)">Tell me more</button>
                            <div class="extra">
                                <a class="btn-evenmore" href="location.html?name=${encodeURIComponent(loc.name)}">Tell me even more</a>
                            </div>
                        </div>
                    </div>
                `
            })
        }

    function toggleDetail(card, locName, lat, lng) {
        document.querySelectorAll('.card').forEach(function(c) {
            c.classList.remove("open")
        })
        card.classList.toggle("open")

        if (lat && lng) {
            map.flyTo([lat, lng], 15)
            markers.forEach(function(m) {
                if (m.name === locName) {
                    m.marker.openPopup()
                }
            })
        }
}

    function filterByGenre(genre) {
        const pills = document.querySelectorAll(".pill")
        pills.forEach(function(pill) {
            pill.classList.remove("active")
        })
        event.target.classList.add("active")

        if (genre === "All") {
            showCard(filming)
        } else {
            const filtered = filming.filter(function(loc) {
                return loc.genre === genre
            })
            showCard(filtered)
        }
    }

    showCard(filming)

    const map = L.map('map').setView([-12.0464, -77.0428], 12)

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map)

    filming.forEach(function(loc) {
        if (loc.lat && loc.lng) {
            const marker = L.marker([loc.lat, loc.lng], { icon: createPin(loc.genre) })
            .addTo(map)
            .bindPopup(`<b>${loc.name}</b><br>${loc.movie} (${loc.year})`)
        markers.push({ name: loc.name, marker: marker })
        }
    })

    function expandCard(event, btn) {
        event.stopPropagation()
        const extra = btn.nextElementSibling
        extra.classList.toggle('open')
        btn.textContent = extra.classList.contains('open') ? 'Tell me less' : 'Tell me more'
    }

    document.getElementById('heroBtn').addEventListener('click', function() {
    const mainSection = document.querySelector('.main');
    if(mainSection){
        mainSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
});

    </script>
</body>
</html>
