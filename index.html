<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lima Live Museum of Movie Locations</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="navbar-placeholder"></div>
    <script src="navbar.js"></script>

    <section class="hero">
        <h1>Welcome to the Lima Live Museum of Movie Locations</h1>
        <p>Discover iconic movie locations around the world through maps, stories, and photos!</p>
        <button class="hero-cta" id="heroBtn">Explore the locations</button>
    </section>

    <div class="filter-bar">
        <button class="pill active" onclick="filterByDistrict(event, 'All')">All</button>
        <button class="pill" style="--color: #9b1c1c" onclick="filterByDistrict(event, 'Lima')">Lima</button>
        <button class="pill" style="--color: #166534" onclick="filterByDistrict(event, 'Miraflores')">Miraflores</button>
        <button class="pill" style="--color: #854d0e" onclick="filterByDistrict(event, 'Centro Historico')">Centro Histórico</button>
        <button class="pill" style="--color: #1e40af" onclick="filterByDistrict(event, 'Callao')">Callao</button>
        <button class="pill" style="--color: #633806" onclick="filterByDistrict(event, 'Chorrillos')">Chorrillos</button>
        <button class="pill" style="--color: #6b21a8" onclick="filterByDistrict(event, 'Barranco')">Barranco</button>
        <button class="pill" style="--color: #0f766e" onclick="filterByDistrict(event, 'Magdalena del Mar')">Magdalena del Mar</button>
        <button class="pill" style="--color: #9d174d" onclick="filterByDistrict(event, 'Breña')">Breña</button>
        <button class="pill" style="--color: #075985" onclick="filterByDistrict(event, 'Jesús María')">Jesús María</button>
        <button class="pill" style="--color: #3f6212" onclick="filterByDistrict(event, 'Pueblo Libre')">Pueblo Libre</button>
        <button class="pill" style="--color: #9a3412" onclick="filterByDistrict(event, 'San Miguel')">San Miguel</button>
        <button class="pill" style="--color: #334155" onclick="filterByDistrict(event, 'Rimac')">Rímac</button>
        <button class="pill" style="--color: #164e63" onclick="filterByDistrict(event, 'Las Islas')">Las Islas</button>
        <button class="pill" style="--color: #86198f" onclick="filterByDistrict(event, 'San Isidro')">San Isidro</button>
    </div>

    <div class="main">
        <div class="map" id="map"></div>
        <div class="card-list" id="list"></div>
    </div>

    <!-- CARD TEMPLATE! Invisible block working like a reusable skeleton. map.js clones it once per location, fills in the values, then appends the result to #list. -->
    <template id="card-template">
        <div class="card">
            <h2 data-field="name"></h2>
            <div class="meta">
                <span class="badge" data-field="badge"></span>
            </div>
            <div class="movies-list" data-field="movies"></div>
            <div class="detail">
                <hr>
                <p class="description" data-field="description"></p>
                <button class="btn-more">Tell me more...</button>
                <div class="extra">
                    <p class="access" data-field="access"></p>
                    <a class="btn-evenmore" data-field="link">Tell me even more...</a>
                </div>
            </div>
        </div>
    </template>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="data.js"></script>
    <script src="map.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
