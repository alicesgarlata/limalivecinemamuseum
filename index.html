<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lima Live Museum of Movie Locations</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="navbar-placeholder"></div>
    <script src="navbar.js"></script>

    <section class="hero">
        <h1>Welcome to the Lima Live Museum of Movie Locations</h1>
        <p>Discover iconic movie locations around the world through maps, stories, and photos!</p>
        <button class="hero-cta" id="heroBtn">Explore the locations</button>
    </section>

    <div class="filter-bar" id="filter-bar"></div>

    <div class="main">
        <div class="map" id="map"></div>
        <div class="card-list" id="list"></div>
    </div>

    <!--
        CARD TEMPLATE
        This block is invisible to the browser — it's just a reusable skeleton.
        map.js clones it once per location, fills in the values, then appends
        the result to #list. No HTML is built as a string in JavaScript.

        data-field="..." marks each slot that JS needs to fill in.
    -->
    <template id="card-template">
        <div class="card">
            <h2 data-field="name"></h2>
            <div class="meta">
                <span class="badge" data-field="badge"></span>
            </div>
            <div class="movies-list" data-field="movies"></div>
            <div class="detail">
                <hr>
                <p class="description" data-field="description"></p>
                <button class="btn-more">Tell me more…</button>
                <div class="extra">
                    <p class="access" data-field="access"></p>
                    <a class="btn-evenmore" data-field="link">Tell me even more →</a>
                </div>
            </div>
        </div>
    </template>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="data.js"></script>
    <script src="map.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
