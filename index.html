<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lima Live Museum of Movie Locations</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>

    <header>
        <div class="nav-logo">
            <a href="index.html">Lima Live Museum of Movie Locations</a>
            <span class="site-sub">Explore iconic movie locations around the world</span>
        </div>
        <nav class="nav-links">
            <a href="index.html" class="nav-link">Map</a>
            <a href="disclaimer_page.html" class="nav-link">About</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Welcome to the Lima Live Museum</h1>
        <p>Discover iconic movie locations around the world through maps, stories, and photos!</p>
        <button class="hero-cta" id="heroBtn">Explore Locations</button>
    </section>

    <div class="filter-bar">
        <button class="pill active" onclick="filterByDistrict('All')">All</button>
        <button class="pill" style="--color: #9b1c1c" onclick="filterByDistrict('Lima')">Lima</button>
        <button class="pill" style="--color: #166534" onclick="filterByDistrict('Miraflores')">Miraflores</button>
        <button class="pill" style="--color: #854d0e" onclick="filterByDistrict('Centro Historico')">Centro Histórico</button>
        <button class="pill" style="--color: #1e40af" onclick="filterByDistrict('Callao')">Callao</button>
        <button class="pill" style="--color: #633806" onclick="filterByDistrict('Chorrillos')">Chorrillos</button>
        <button class="pill" style="--color: #6b21a8" onclick="filterByDistrict('Barranco')">Barranco</button>
        <button class="pill" style="--color: #0f766e" onclick="filterByDistrict('Magdalena del Mar')">Magdalena del Mar</button>
        <button class="pill" style="--color: #9d174d" onclick="filterByDistrict('Breña')">Breña</button>
        <button class="pill" style="--color: #075985" onclick="filterByDistrict('Jesús María')">Jesús María</button>
        <button class="pill" style="--color: #3f6212" onclick="filterByDistrict('Pueblo Libre')">Pueblo Libre</button>
        <button class="pill" style="--color: #9a3412" onclick="filterByDistrict('San Miguel')">San Miguel</button>
        <button class="pill" style="--color: #334155" onclick="filterByDistrict('Rimac')">Rímac</button>
        <button class="pill" style="--color: #164e63" onclick="filterByDistrict('Las Islas')">Las Islas</button>
        <button class="pill" style="--color: #86198f" onclick="filterByDistrict('San Isidro')">San Isidro</button>
    </div>

    <div class="main">
        <div class="map" id="map"></div>
        <div class="card-list" id="list"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="map.js"></script>
</body>
</html>
