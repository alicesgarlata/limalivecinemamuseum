<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Location - Lima Live Museum</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="nav-logo">
            <a href="index.html">Lima Live Museum of Movie Locations</a>
            <span class="site-sub">Explore iconic movie locations around the world</span>
        </div>
        <nav class="nav-links">
            <a href="index.html" class="nav-link">Map</a>
            <a href="disclaimer_page.html" class="nav-link">About</a>
        </nav>
    </header>

    <!-- SIDE MENU -->
    <nav class="side-menu" id="side-menu">
        <div class="menu-header">
            <button class="close-btn" onclick="toggleMenu()">✕</button>
        </div>
        <a href="index.html" class="menu-link">Home - Map</a>
        <a href="disclaimer_page.html" class="menu-link">About</a>
    </nav>
    <div class="menu-overlay" id="menu-overlay" onclick="toggleMenu()"></div>

    <!-- LOCATION PAGE -->
    <div class="location-page">
        <a href="index.html" class="back-link">← Back to map</a>
        
        <div class="location-header">
            <p class="label" id="loc-movie"></p>
            <h1 id="loc-name"></h1>
            <div class="meta">
                <span id="loc-country"></span>
                <span class="badge" id="loc-badge"></span>
            </div>
        </div>

        <!-- TONE BUTTONS -->
        <div class="tone-bar">
            <button class="tone-btn active" onclick="setTone('young', this)">Young</button>
            <button class="tone-btn" onclick="setTone('adult', this)">Adult</button>
            <button class="tone-btn" onclick="setTone('professional', this)">Professional</button>
        </div>

        <!-- DESCRIPTION -->
        <div class="location-body">
            <div id="loc-description" class="loc-description"></div>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        // Lista location (puoi aggiungere altre location qui)
        const filming = [
            {
                movie: "Gladiator",
                year: 2000,
                name: "Plaza de roba",
                country: "Peru",
                genre: "Drama",
                descriptions: {
                    young: "Okay, this place feels straight out of an epic movie. Imagine walking here and thinking about gladiators fighting for glory.",
                    adult: "This location evokes the grandeur and intensity of historical cinema, offering visitors a tangible connection to the atmosphere portrayed in the film.",
                    professional: "The site functions as a cinematic reconstruction of historical space, where visual storytelling amplifies themes of power, spectacle, and collective memory."
                },
                access: "Public - book tickets online in advance"
            },
            {
                movie: "Game of Thrones",
                year: 2011,
                name: "Via a caso",
                country: "Peru",
                genre: "Fantasy",
                descriptions: {
                    young: "This is literally giving King's Landing vibes. You can almost picture dragons flying overhead and political drama happening in every corner.",
                    adult: "The location captures the layered atmosphere of intrigue and power seen in the series, blending architecture with narrative tension.",
                    professional: "This space exemplifies the transformation of real environments into fictional political geographies through audiovisual narration."
                },
                access: "Public - best visited outside peak season."
            }
        ];

        // Prende il parametro dalla URL
        const params = new URLSearchParams(window.location.search);
        const locationName = params.get('name');
        const loc = filming.find(l => l.name === locationName) || filming[0]; // fallback alla prima location

        // Mostra dati della location
        document.getElementById('loc-movie').textContent = loc.movie + ' · ' + loc.year;
        document.getElementById('loc-name').textContent = loc.name;
        document.getElementById('loc-country').textContent = loc.country;

        const badge = document.getElementById('loc-badge');
        badge.textContent = loc.genre;
        badge.className = 'badge ' + loc.genre.toLowerCase();

        const descEl = document.getElementById('loc-description');
        descEl.textContent = loc.descriptions.young;

        // Funzione per cambiare tono
        function setTone(tone, btn) {
            document.querySelectorAll('.tone-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            descEl.textContent = loc.descriptions[tone];
        }

        // Menu hamburger
        function toggleMenu() {
            document.getElementById('side-menu').classList.toggle('open');
            document.getElementById('menu-overlay').classList.toggle('open');
        }
    </script>
</body>
</html>
