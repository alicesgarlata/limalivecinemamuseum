<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Location - Lima Live Museum</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <button class="hamburger" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <span class="site-title">Lima Live Museum of Movie Locations</span>
        <span class="site-sub">Explore iconic movie locations around the world</span>
    </header>

    <nav class="side-menu" id="side-menu">
        <div class="menu-header">
            <button class="close-btn" onclick="toggleMenu()">✕</button>
        </div>
        <a href="index.html" class="menu-link">Home - Map</a>
        <a href="about.html" class="menu-link">About</a>
    </nav>

    <div class="menu-overlay" id="menu-overlay" onclick="toggleMenu()"></div>

    <div class="location-page">
        <a href="index.html" class="back-link">← Back to map</a>
        <div class="location-header">
            <p class="label" id="loc-movie">Movie Title · Year</p>
            <h1 id="loc-name">Location Name</h1>
            <div class="meta">
                <span id="loc-country">Country</span>
                <span class="badge" id="loc-badge">Genre</span>
            </div>
        </div>

        <div class="tone-bar">
            <button class="tone-btn active" onclick="setTone('young', this)">Young</button>
            <button class="tone-btn" onclick="setTone('adult', this)">Adult</button>
            <button class="tone-btn" onclick="setTone('professional', this)">Professional</button>
        </div>

        <div class="location-body">
            <div id="loc-description" class="loc-description"></div>
        </div>
    </div>

    <script>
        // Dati della location
        const loc = {
            movie: "Gladiator",
            year: 2000,
            name: "Plaza de roba",
            country: "Peru",
            genre: "Drama",
            descriptions: {
                young: "Okay, this place feels straight out of an epic movie. Imagine walking here and thinking about gladiators fighting for glory. It’s dramatic, intense, and honestly kind of surreal.",
                adult: "This location evokes the grandeur and intensity of historical cinema, offering visitors a tangible connection to the atmosphere portrayed in the film.",
                professional: "The site functions as a cinematic reconstruction of historical space, where visual storytelling amplifies themes of power, spectacle, and collective memory."
            }
        };

        // Inserisci i dati della location nella pagina
        document.getElementById('loc-movie').textContent = loc.movie + ' · ' + loc.year;
        document.getElementById('loc-name').textContent = loc.name;
        document.getElementById('loc-country').textContent = loc.country;
        const badge = document.getElementById('loc-badge');
        badge.textContent = loc.genre;
        badge.className = 'badge ' + loc.genre.toLowerCase();

        // Mostra descrizione iniziale
        document.getElementById('loc-description').textContent = loc.descriptions.young;

        // Funzione per cambiare tono
        function setTone(tone, btn) {
            // Aggiorna lo stato dei bottoni
            document.querySelectorAll('.tone-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // Cambia descrizione
            document.getElementById('loc-description').textContent = loc.descriptions[tone];
        }

        // Funzione per aprire/chiudere menu laterale
        function toggleMenu() {
            document.getElementById('side-menu').classList.toggle('open');
            document.getElementById('menu-overlay').classList.toggle('open');
        }
    </script>
</body>
</html>
