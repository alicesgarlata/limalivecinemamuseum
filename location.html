<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Location — Lima Live Cinema Museum</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="images/favicon.png">
</head>
<body>
    <div id="navbar-placeholder"></div>
    <script src="javascript/navbar.js"></script>
    <script src="javascript/theme.js"></script>

    <div class="location-page">
        <a href="index.html" class="back-link">← Back to map</a>

        <div class="location-header" id="loc-header">
            <div class="location-header-overlay"></div>
            <div class="location-header-content">
                <h1 id="loc-name"></h1>
                <div class="meta">
                    <span class="badge" id="loc-badge"></span>
                    <span class="loc-address" id="loc-address"></span>
                </div>
            </div>
        </div>

        <div class="location-grid">
            <div class="location-main">

                <div class="difficulty-bar">
                    <button class="difficulty-btn" id="btn-simpler">← Too difficult</button>
                    <span class="difficulty-label" id="difficulty-label">Adult</span>
                    <button class="difficulty-btn" id="btn-harder">Too simple →</button>
                </div>

                <div class="difficulty-bar">
                    <button class="difficulty-btn" id="btn-shorter">← Too long</button>
                    <span class="difficulty-label" id="length-label">Mid</span>
                    <button class="difficulty-btn" id="btn-longer">Too short →</button>
                </div>

                <p id="loc-description" class="loc-description"></p>
                <p class="loc-fallback-note" id="loc-fallback-note"></p>

                <p class="loc-access" id="loc-access"></p>

                <div id="loc-scheda" class="loc-scheda"></div>
            </div>

            <aside class="location-films-col">
                <h2 class="films-heading" id="loc-films-heading"></h2>
                <div id="loc-films" class="loc-films"></div>
            </aside>
        </div>
    </div>

    <dialog class="location-film-lightbox" id="location-film-lightbox" aria-labelledby="location-film-lightbox-caption">
        <button class="location-film-lightbox-close" id="location-film-lightbox-close" type="button" aria-label="Close enlarged image">×</button>
        <figure class="location-film-lightbox-figure">
            <img id="location-film-lightbox-image" alt="">
            <figcaption id="location-film-lightbox-caption"></figcaption>
        </figure>
    </dialog>

    <script src="javascript/data.js"></script>
    <script src="javascript/schede.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="javascript/location.js"></script>
</body>
</html>
